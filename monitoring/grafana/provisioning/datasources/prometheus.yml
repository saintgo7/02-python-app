apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    orgId: 1
    url: http://prometheus:9090
    password: ""
    user: ""
    database: ""
    basicAuth: false
    isDefault: true
    jsonData:
      timeInterval: 15s
    editable: true

  - name: Elasticsearch
    type: elasticsearch
    access: proxy
    orgId: 1
    url: http://elasticsearch:9200
    password: ""
    user: ""
    database: "[logs-]YYYY.MM.DD"
    basicAuth: false
    isDefault: false
    jsonData:
      esVersion: "8.0.0"
      logMessageField: message
      logLevelField: level
      timeField: "@timestamp"
    editable: true

  - name: Loki
    type: loki
    access: proxy
    orgId: 1
    url: http://loki:3100
    password: ""
    user: ""
    database: ""
    basicAuth: false
    isDefault: false
    editable: true
