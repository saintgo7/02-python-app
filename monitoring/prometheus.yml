global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'python-apps'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load rules
rule_files:
  - alert_rules.yml

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # AlertManager
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']

  # Node Exporter
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # cAdvisor (Container metrics)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # Application 1-420 - Backend Apps
  # Configure scrape for all backend applications
  - job_name: 'backend-apps'
    scrape_interval: 10s
    static_configs:
      # Apps 1-50
      - targets:
          - 'localhost:8001'  # App 1
          - 'localhost:8002'  # App 2
          - 'localhost:8003'  # App 3
          # ... add all 420 apps with unique ports
        labels:
          app_type: 'backend'
    metric_relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # Docker Daemon Metrics
  - job_name: 'docker'
    static_configs:
      - targets: ['localhost:9323']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # Elasticsearch
  - job_name: 'elasticsearch'
    static_configs:
      - targets: ['elasticsearch:9200']
    metric_relabel_configs:
      - regex: 'node_|es_'
        action: keep

  # Service Discovery (if using Consul, Kubernetes, etc.)
  # Uncomment for Kubernetes:
  # - job_name: 'kubernetes-apiservers'
  #   kubernetes_sd_configs:
  #     - role: endpoints
  #   scheme: https
  #   tls_config:
  #     ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
  #   bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
  #   relabel_configs:
  #     - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
  #       action: keep
  #       regex: default;kubernetes;https

# Remote storage (optional - for long-term storage)
# remote_write:
#   - url: http://remote-storage:9009/api/v1/push
