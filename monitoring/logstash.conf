input {
  tcp {
    port => 5000
    codec => json
  }

  udp {
    port => 5000
    codec => json
  }

  # Syslog input
  syslog {
    port => 514
    codec => plain
  }

  # File input for application logs
  file {
    path => "/var/log/apps/**/*.log"
    start_position => "beginning"
    codec => multiline {
      pattern => "^\["
      what => "previous"
    }
  }

  # Docker logs
  tcp {
    port => 5001
    type => "docker"
    codec => json
  }

  # Kafka input (optional)
  # kafka {
  #   bootstrap_servers => "kafka:9092"
  #   topics => ["app-logs"]
  #   codec => json
  # }
}

filter {
  # Parse JSON logs
  if [type] == "json" {
    json {
      source => "message"
    }
  }

  # Parse syslog
  if [type] == "syslog" {
    grok {
      match => { "message" => "%{SYSLOGLINE}" }
    }
  }

  # Add environment tags
  mutate {
    add_field => {
      "[@metadata][index_name]" => "logs-%{+YYYY.MM.dd}"
      "environment" => "${ENVIRONMENT:production}"
      "cluster" => "${CLUSTER_NAME:default}"
    }
  }

  # Parse timestamp
  date {
    match => [ "timestamp", "ISO8601", "yyyy-MM-dd'T'HH:mm:ss.SSSZ" ]
    target => "@timestamp"
  }

  # Extract severity level
  if [level] {
    mutate {
      convert => { "level" => "string" }
    }
  }

  # Filter out health checks
  if [path] =~ /health/ or [endpoint] =~ /health/ {
    drop {}
  }

  # Filter out metrics endpoint
  if [path] =~ /metrics/ or [endpoint] =~ /metrics/ {
    drop {}
  }

  # Kubernetes metadata enrichment
  kubernetes {
    kubernetes_url => "https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}"
    ca_file => "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
    token_file => "/var/run/secrets/kubernetes.io/serviceaccount/token"
    namespace_file => "/var/run/secrets/kubernetes.io/serviceaccount/namespace"
    match_namespace_labels => true
    merge_log => true
  }

  # GeoIP enrichment (optional)
  # geoip {
  #   source => "client_ip"
  # }

  # Remove sensitive fields
  mutate {
    remove_fields => [
      "[password]",
      "[api_key]",
      "[secret]",
      "[token]",
      "[auth]"
    ]
  }
}

output {
  # Elasticsearch output
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "%{[@metadata][index_name]}"
    doc_type => "_doc"
    codec => json
    template_name => "logs"
    template_overwrite => true
    template => "/usr/share/logstash/templates/logs-template.json"
  }

  # Stdout for debugging
  # stdout {
  #   codec => rubydebug
  # }

  # Kafka output (optional)
  # kafka {
  #   bootstrap_servers => "kafka:9092"
  #   topic_id => "logs-processed"
  #   codec => json
  # }

  # File output (optional)
  # file {
  #   path => "/var/log/logstash/processed_%{+YYYY-MM-dd}.log"
  #   codec => json
  # }

  # S3 archive (optional)
  # s3 {
  #   region => "${AWS_REGION:us-east-1}"
  #   bucket => "logs-archive"
  #   prefix => "logs/%{+YYYY/MM/dd}/"
  #   codec => json
  # }
}
